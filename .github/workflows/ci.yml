name: Website CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run lint
      - name: Build production frontend
        env:
          SITE_URL: https://raphics-ci.example.test
        run: bun run build
      - name: Verify SEO build output
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base = 'https://raphics-ci.example.test';
          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const robots = fs.readFileSync('dist/robots.txt', 'utf8');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          if (!sitemap.includes('<loc>' + base + '/</loc>')) throw new Error('Sitemap must contain absolute canonical URLs');
          if (!robots.includes('Sitemap: ' + base + '/sitemap.xml')) throw new Error('robots.txt must point to the absolute sitemap URL');
          if (!html.includes('rel="canonical" href="' + base + '/"')) throw new Error('Canonical link is missing from built HTML');
          if (!html.includes('property="og:url" content="' + base + '/"')) throw new Error('Open Graph URL is missing from built HTML');
          console.log('SEO assets verified for ' + base);
          NODE
